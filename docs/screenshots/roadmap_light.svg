<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc" />

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="800" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Logo -->
  <rect x="24" y="24" width="36" height="36" rx="10" fill="url(#brandGrad)" />
  <text x="36" y="47" font-size="18" font-weight="800" fill="#ffffff">SB</text>
  <text x="70" y="42" font-size="16" font-weight="700" fill="#0f172a">SkillBridge</text>
  <text x="70" y="56" font-size="10" font-weight="500" fill="#64748b">v1.0.0 • Microservices</text>

  <!-- Sidebar Navigation Items -->
  <g transform="translate(16, 90)">
    <rect x="0" y="0" width="208" height="36" rx="8" fill="transparent" opacity="0" />
    <text x="36" y="23" font-size="13" font-weight="600" fill="#64748b">📊 Dashboard</text>
    
    <rect x="0" y="44" width="208" height="36" rx="8" fill="transparent" opacity="0" />
    <text x="36" y="67" font-size="13" font-weight="600" fill="#64748b">⚡ My Skills</text>
    
    <rect x="0" y="88" width="208" height="36" rx="8" fill="transparent" opacity="0" />
    <text x="36" y="111" font-size="13" font-weight="600" fill="#64748b">🎯 Career Goal</text>

    <rect x="0" y="132" width="208" height="36" rx="8" fill="#4f46e5" opacity="1" />
    <text x="36" y="155" font-size="13" font-weight="600" fill="#ffffff">🗺️ Learning Roadmap</text>

    <rect x="0" y="176" width="208" height="36" rx="8" fill="transparent" opacity="0" />
    <text x="36" y="199" font-size="13" font-weight="600" fill="#64748b">💼 Opportunities</text>

    <rect x="0" y="220" width="208" height="36" rx="8" fill="transparent" opacity="0" />
    <text x="36" y="243" font-size="13" font-weight="600" fill="#64748b">📡 System Status</text>
  </g>

  <!-- Top Navbar -->
  <rect x="240" y="0" width="960" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="264" y="38" font-size="14" font-weight="500" fill="#64748b">Pages / <tspan font-weight="700" fill="#0f172a">Topological Learning Roadmap</tspan></text>
  
  <!-- Active Student Pill -->
  <rect x="840" y="16" width="180" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="856" cy="32" r="10" fill="#4f46e5" />
  <text x="852" y="36" font-size="10" font-weight="700" fill="#ffffff">A</text>
  <text x="874" y="37" font-size="12" font-weight="600" fill="#0f172a">Alex Chen (Yr 3)</text>

  <!-- Microservice Status Pill -->
  <rect x="1030" y="16" width="140" height="32" rx="16" fill="#10b98115" stroke="#10b98140" stroke-width="1" />
  <circle cx="1046" cy="32" r="4" fill="#10b981" />
  <text x="1058" y="37" font-size="11" font-weight="700" fill="#10b981">Services Live</text>

  <!-- Main Content Area -->
  <g transform="translate(264, 88)">
    <text x="0" y="24" font-size="24" font-weight="800" fill="#0f172a">Topological Learning Roadmap</text>
    <text x="0" y="46" font-size="13" font-weight="400" fill="#64748b">Interactive platform preview • Mode: LIGHT • SkillBridge Distributed Microservices</text>

    <!-- Content Cards Grid -->
    <rect x="0" y="70" width="280" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="100" font-size="12" font-weight="600" fill="#64748b">Career Readiness</text>
    <text x="20" y="140" font-size="28" font-weight="800" fill="#4f46e5">68.5%</text>
    <rect x="20" y="155" width="240" height="8" rx="4" fill="#e2e8f0" />
    <rect x="20" y="155" width="164" height="8" rx="4" fill="#4f46e5" />

    <rect x="304" y="70" width="280" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="324" y="100" font-size="12" font-weight="600" fill="#64748b">Skills Breakdown</text>
    <text x="324" y="140" font-size="28" font-weight="800" fill="#10b981">6 <tspan font-size="16" fill="#64748b">Matched</tspan></text>
    <text x="440" y="140" font-size="28" font-weight="800" fill="#f59e0b">3 <tspan font-size="16" fill="#64748b">Dev</tspan></text>

    <rect x="608" y="70" width="280" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="628" y="100" font-size="12" font-weight="600" fill="#64748b">Matched Opportunities</text>
    <text x="628" y="140" font-size="28" font-weight="800" fill="#6366f1">12 Open</text>
    <text x="628" y="162" font-size="11" font-weight="500" fill="#10b981">Top match: 91% compatible</text>

    <!-- Large Display Container -->
    <rect x="0" y="200" width="888" height="470" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="24" y="236" font-size="16" font-weight="700" fill="#0f172a">Primary Domain View: Topological Learning Roadmap</text>
    <line x1="24" y1="256" x2="864" y2="256" stroke="#e2e8f0" stroke-width="1" />

    <!-- Mock Graph / Data Representation -->
    <rect x="24" y="276" width="400" height="370" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="44" y="306" font-size="13" font-weight="600" fill="#0f172a">Skill Distribution &amp; Competencies</text>
    
    <!-- Radar Chart Simulation -->
    <polygon points="224,340 310,400 280,520 168,520 138,400" fill="none" stroke="#e2e8f0" stroke-width="1" />
    <polygon points="224,380 270,420 250,490 198,490 178,420" fill="none" stroke="#e2e8f0" stroke-width="1" />
    <polygon points="224,360 290,410 260,500 188,510 160,410" fill="#4f46e530" stroke="#4f46e5" stroke-width="2" />

    <!-- Side Data List -->
    <g transform="translate(444, 276)">
      <rect x="0" y="0" width="420" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="16" y="28" font-size="13" font-weight="700" fill="#0f172a">Full Stack Developer (Target Role)</text>
      <text x="16" y="48" font-size="11" font-weight="500" fill="#64748b">Topological stages computed: 9 learning checkpoints</text>
      <rect x="16" y="58" width="60" height="16" rx="8" fill="#10b98120" />
      <text x="26" y="70" font-size="9" font-weight="700" fill="#10b981">MATCHED</text>

      <rect x="0" y="96" width="420" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="16" y="124" font-size="13" font-weight="700" fill="#0f172a">Cloud Infrastructure &amp; Microservices</text>
      <text x="16" y="144" font-size="11" font-weight="500" fill="#64748b">Inter-service connection latency: 12ms (Operational)</text>
      <rect x="16" y="154" width="70" height="16" rx="8" fill="#f59e0b20" />
      <text x="24" y="166" font-size="9" font-weight="700" fill="#f59e0b">DEVELOPING</text>

      <rect x="0" y="192" width="420" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="16" y="220" font-size="13" font-weight="700" fill="#0f172a">Distributed Matching Engine</text>
      <text x="16" y="240" font-size="11" font-weight="500" fill="#64748b">Explainable compatibility rankings active</text>
      <rect x="16" y="250" width="60" height="16" rx="8" fill="#4f46e520" />
      <text x="26" y="262" font-size="9" font-weight="700" fill="#4f46e5">VERIFIED</text>
    </g>
  </g>
</svg>
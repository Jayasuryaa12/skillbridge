version: "3.8"

services:
  # ── Local MongoDB Instance ──────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: skillbridge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - skillbridge-net

  # ── Opportunity Service (Port 5002) ─────────────────────────────────────────
  opportunity-service:
    build:
      context: ./opportunity-service
      dockerfile: Dockerfile
    container_name: skillbridge-opportunity-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - FLASK_ENV=production
      - MONGO_URI=mongodb://mongo:27017/opportunity_db
      - DB_NAME=opportunity_db
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - INTER_SERVICE_KEY=local_docker_inter_service_secret_key_12345
    depends_on:
      - mongo
    networks:
      - skillbridge-net

  # ── Skill Service (Port 5001) ───────────────────────────────────────────────
  skill-service:
    build:
      context: ./skill-service
      dockerfile: Dockerfile
    container_name: skillbridge-skill-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - MONGO_URI=mongodb://mongo:27017/skill_db
      - DB_NAME=skill_db
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - OPPORTUNITY_SERVICE_URL=http://opportunity-service:5002
      - INTER_SERVICE_KEY=local_docker_inter_service_secret_key_12345
      - OPPORTUNITY_CONNECT_TIMEOUT=10.0
      - OPPORTUNITY_READ_TIMEOUT=20.0
    depends_on:
      - mongo
      - opportunity-service
    networks:
      - skillbridge-net

  # ── React + Vite Frontend (Port 5173 -> Container Port 80) ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SKILL_API_URL=http://localhost:5001/api
        - VITE_OPPORTUNITY_API_URL=http://localhost:5002/api
    container_name: skillbridge-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - skill-service
      - opportunity-service
    networks:
      - skillbridge-net

networks:
  skillbridge-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local

name: SkillBridge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Microservices Unit & Integration Tests ─────────────────────────
  backend-tests:
    name: Backend Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [skill-service, opportunity-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "${{ matrix.service }}/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt

      - name: Run Pytest Suite
        env:
          FLASK_ENV: testing
          TESTING: "true"
        run: |
          pytest ${{ matrix.service }}/tests/ -v --color=yes

  # ── Frontend Lint & Production Build Validation ────────────────────────────
  frontend-build:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build Frontend Application
        working-directory: frontend
        env:
          VITE_SKILL_API_URL: http://localhost:5001/api
          VITE_OPPORTUNITY_API_URL: http://localhost:5002/api
        run: |
          npm run build

      - name: Verify Build Artifacts
        run: |
          test -f frontend/dist/index.html
          echo "Frontend dist bundle successfully verified."
